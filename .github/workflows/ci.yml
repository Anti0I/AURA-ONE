name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    # The e2e suite decodes VP9 and renders three.js through software WebGL on a
    # two-core runner. It takes ~6 minutes locally and there is no reason to
    # expect better there.
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      # The encoded video and the still fallback are both committed, so the build
      # needs neither a headless render nor ffmpeg. `npm run assets:all`
      # regenerates them when the scene changes; it is deliberately not part of
      # CI, because a four-minute SwiftShader render on every push buys nothing.
      - name: Build
        run: npm run build

      - name: Asset budget
        run: npm run audit:budget

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      # Both suites run against the production build from the step above:
      # playwright.config.ts starts `npm run start` rather than rebuilding
      # when CI is set.
      - name: End-to-end tests
        run: npm run test:e2e

      - name: Accessibility audit
        run: npm run test:a11y -- --project=desktop

      # Its own step and its own config, at one worker. This one measures how
      # promptly frames reach a canvas, and a second browser decoding VP9 beside
      # it changes the answer by a factor of four.
      - name: Scrub performance
        run: npm run test:perf

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
